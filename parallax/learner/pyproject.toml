[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-learner"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cuda-core>=1.2.0",
    "jax[cuda12]==0.11.1",
    "jaxtyping",
    "einops",
    "transformers",
    "optax>=0.2.8",
    "safetensors>=0.8.0",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "huggingface-hub>=1.28.0",
    "wandb>=0.29.0",
    "jinja2>=3.1.6",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "nvidia-ml-py>=13.610.43",
    "nccl-extensions[cu12]==0.1.0",
]

[tool.uv]
override-dependencies = ["nvidia-nccl-cu12==2.30.7"]

[tool.setuptools.packages.find]
where = [".."]
include = ["parallax.learner*"]
namespaces = true
